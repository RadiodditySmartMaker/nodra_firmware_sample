[platformio]
boards_dir = ${common.board_dir}
src_dir = .

[common]
board_dir = examples/01-led/board
board_nodara_dir = ${common.board_dir}/nodara
variant_source = +<${common.board_nodara_dir}/variant.cpp>

[env]
platform = nordicnrf52
framework = arduino
board = nodara
monitor_speed = 115200
upload_protocol = nrfutil
board_build.ldscript = ${common.board_nodara_dir}/nrf52840_s140_v6_nodara.ld

build_flags =
    -Os
    -I ${common.board_nodara_dir}
    -D ARDUINO_NODARA

[env:led]
build_src_filter =
    -<*>
    +<examples/01-led/src/>
    ${common.variant_source}
