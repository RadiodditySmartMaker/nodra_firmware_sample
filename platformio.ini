[platformio]
boards_dir = ${common.board_dir}
src_dir = .

[common]
board_dir = examples/01-led/board
board_nodara_dir = ${common.board_dir}/nodara
variant_source = +<${common.board_nodara_dir}/variant.cpp>

eink_flags = -D PIO_ENABLE_ELINK_GDEM0213B74
button_flags = -D PIO_ENABLE_BUTTON
lora_flags = -D PIO_ENABLE_LORA_RA01S
usb_cdc_flags = -D CFG_TUSB_CONFIG_FILE=\"tusb_config_nodara.h\"

[env]
framework = arduino
monitor_speed = 115200

[nodara]
platform = nordicnrf52
board = nodara
upload_protocol = nrfutil
board_build.ldscript = ${common.board_nodara_dir}/nrf52840_s140_v6_nodara.ld

build_flags =
    -Os
    -I ${common.board_nodara_dir}
    -D ARDUINO_NODARA

[env:led]
extends = nodara
build_src_filter =
    -<*>
    +<examples/01-led/src/>
    ${common.variant_source}

[env:eink-hello-world]
extends = nodara
build_src_filter =
    -<*>
    +<examples/02-eink/eink-hello-world/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-hello-world/lib
build_flags =
    ${nodara.build_flags}
    ${common.eink_flags}

[env:eink-icon-movement]
extends = nodara
build_src_filter =
    -<*>
    +<examples/02-eink/eink-icon-movement/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-icon-movement/lib
build_flags =
    ${nodara.build_flags}
    ${common.eink_flags}
    ${common.button_flags}

[env:eink-serial-text]
extends = nodara
build_src_filter =
    -<*>
    +<examples/02-eink/eink-serial-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-serial-text/lib
build_flags =
    ${nodara.build_flags}
    -I examples/02-eink/eink-serial-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-advertising]
extends = nodara
build_src_filter =
    -<*>
    +<examples/03-ble/ble-advertising/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-advertising/lib
build_flags =
    ${nodara.build_flags}
    -I examples/03-ble/ble-advertising/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-led-control]
extends = nodara
build_src_filter =
    -<*>
    +<examples/03-ble/ble-led-control/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-led-control/lib
build_flags =
    ${nodara.build_flags}
    -I examples/03-ble/ble-led-control/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-eink-text]
extends = nodara
build_src_filter =
    -<*>
    +<examples/03-ble/ble-eink-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-eink-text/lib
build_flags =
    ${nodara.build_flags}
    -I examples/03-ble/ble-eink-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:lora-send-text]
extends = nodara
build_src_filter =
    -<*>
    +<examples/04-lora/lora-send-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/04-lora/lora-send-text/lib
build_flags =
    ${nodara.build_flags}
    -I examples/04-lora/lora-send-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}
    ${common.lora_flags}
    ${common.button_flags}

[env:lora-receive-text]
extends = nodara
build_src_filter =
    -<*>
    +<examples/04-lora/lora-receive-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/04-lora/lora-receive-text/lib
build_flags =
    ${nodara.build_flags}
    -I examples/04-lora/lora-receive-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}
    ${common.lora_flags}

[env:esp32-s3-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_speed = 115200

build_src_filter =
    -<*>
    +<examples/05-externalS3/src/>

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT

build_flags =
    -I examples/05-externalS3/src
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    https://github.com/tanakamasayuki/EspUsbHost.git
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit VEML7700 Library@^2.1.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.17.4

monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
