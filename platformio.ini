[platformio]
boards_dir = ${common.board_dir}
src_dir = .

[common]
board_dir = examples/01-led/board
board_nodara_dir = ${common.board_dir}/nodara
variant_source = +<${common.board_nodara_dir}/variant.cpp>

eink_flags = -D PIO_ENABLE_ELINK_GDEM0213B74
button_flags = -D PIO_ENABLE_BUTTON
usb_cdc_flags = -D CFG_TUSB_CONFIG_FILE=\"tusb_config_nodara.h\"

[env]
platform = nordicnrf52
framework = arduino
board = nodara
monitor_speed = 115200
upload_protocol = nrfutil
board_build.ldscript = ${common.board_nodara_dir}/nrf52840_s140_v6_nodara.ld

build_flags =
    -Os
    -I ${common.board_nodara_dir}
    -D ARDUINO_NODARA

[env:led]
build_src_filter =
    -<*>
    +<examples/01-led/src/>
    ${common.variant_source}

[env:eink-hello-world]
build_src_filter =
    -<*>
    +<examples/02-eink/eink-hello-world/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-hello-world/lib
build_flags =
    ${env.build_flags}
    ${common.eink_flags}

[env:eink-icon-movement]
build_src_filter =
    -<*>
    +<examples/02-eink/eink-icon-movement/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-icon-movement/lib
build_flags =
    ${env.build_flags}
    ${common.eink_flags}
    ${common.button_flags}

[env:eink-serial-text]
build_src_filter =
    -<*>
    +<examples/02-eink/eink-serial-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/02-eink/eink-serial-text/lib
build_flags =
    ${env.build_flags}
    -I examples/02-eink/eink-serial-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-advertising]
build_src_filter =
    -<*>
    +<examples/03-ble/ble-advertising/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-advertising/lib
build_flags =
    ${env.build_flags}
    -I examples/03-ble/ble-advertising/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-led-control]
build_src_filter =
    -<*>
    +<examples/03-ble/ble-led-control/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-led-control/lib
build_flags =
    ${env.build_flags}
    -I examples/03-ble/ble-led-control/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}

[env:ble-eink-text]
build_src_filter =
    -<*>
    +<examples/03-ble/ble-eink-text/src/>
    ${common.variant_source}
lib_extra_dirs = examples/03-ble/ble-eink-text/lib
build_flags =
    ${env.build_flags}
    -I examples/03-ble/ble-eink-text/board/nodara
    ${common.usb_cdc_flags}
    ${common.eink_flags}
